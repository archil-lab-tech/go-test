substitutions:
  _REGION: europe-west3
  _AR_REPO: app
  _SERVICE: go-api-staging
  _IMAGE_NAME: go-api
  _DB_NAME: app

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
      - BUILDKIT_PROGRESS=plain
    args:
      - build
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:${SHORT_SHA}'
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:${SHORT_SHA}'

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy ${_SERVICE} \
          --region=${_REGION} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:${SHORT_SHA} \
          --allow-unauthenticated \
          --service-account="go-api-sa@$PROJECT_ID.iam.gserviceaccount.com" \
          --set-env-vars=DB_NAME=${_DB_NAME},ENV=${_SERVICE} \
          --set-secrets=MONGO_URI=MONGO_URI:latest

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:${SHORT_SHA}'
