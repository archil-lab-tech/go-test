name: deploy
on:
  push:
    branches: [ "master" ]  # your default branch
  workflow_dispatch:        # allows manual runs

env:
  PROJECT_ID: tensile-cable-476508-c3
  REGION: europe-west3
  SERVICE: go-api
  REPO: app               # Artifact Registry repo name
  IMAGE_NAME: go-test     # image name inside the repo

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write      # required for OIDC
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Auth to Google via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-actions
          service_account: cicd-deployer@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev -q

      - name: Build & push image
        run: |
          TAG=v$(date +%Y%m%d%H%M%S)
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE_NAME }}:${TAG}"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --region=${{ env.REGION }} \
            --image="$IMAGE" \
            --allow-unauthenticated \
            --vpc-connector=cr-connector \
            --vpc-egress=all-traffic \
            --set-env-vars=PORT=8080,DB_NAME=app \
            --set-secrets=MONGO_URI=MONGO_URI:latest

      - name: Route 100% traffic to latest
        run: gcloud run services update-traffic ${{ env.SERVICE }} --region=${{ env.REGION }} --to-latest
